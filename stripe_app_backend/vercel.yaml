# Stripe Projects build-template manifest for this backend (default variant).
#
# Lets anyone scaffold a fresh copy of this app — with a Vercel project
# provisioned for hosting — in one command:
#
#   stripe projects build my-stripe-app-backend --template bensontrent/stripe-app-nextjs-backend
#
# The database is deliberately NOT provisioned here: Stripe Projects' Supabase
# connector can only create a brand-new project (no reuse of an existing one,
# no dedicated schema), while this backend supports both. `npm run setup`
# walks the user through connecting the Supabase project of their choice —
# and offers `stripe projects add supabase/project` as one of the choices.
# Prefer Projects to provision Supabase up front? Use the second variant,
# projects-template.supabase-vercel.yaml.
#
# The copy of record lives in the public registry
# (https://github.com/stripe/projects-template-registry, file
# stripe_app_backend/vercel.yaml; the other variant is
# stripe_app_backend/supabase-vercel.yaml). This in-repo file mirrors it.
# Docs: https://docs.stripe.com/projects/templates
#
# Releasing a new version (`ref` must be a commit that is already on GitHub,
# so it always trails the template change by one commit):
#   1. Commit and push the template change.
#   2. Set `ref` below (and in the other variant) to that commit
#      (`git rev-parse HEAD`), commit, push.
#   3. Open a registry PR that copies both files over the registry copies.
#
# To try a local manifest before it is in the registry (needs a projects
# plugin newer than 0.41.0, which lacks the flag):
#
#   stripe projects build my-app --template-manifest /absolute/path/to/projects-template.yaml

guided:
  # There is no first-class "Stripe App" category in the guided flow yet, so
  # this template surfaces under "Something else". Search still finds it by
  # name, description and tags.
  category: stripe_app
  framework: nextjs

template: bensontrent/stripe-app-nextjs-backend
variant: vercel
default: true
variant_description: Vercel • Better Auth • your own Supabase
install_command: npm install

# Copy the files from the template directory of the community-examples repo.
repo: https://github.com/bensontrent/stripe-apps-community-examples/tree/main/stripe-app-nextjs-backend
# The exact commit users receive (see the release steps above).
ref: 1ce2e22bf9040ede3a0372a4a33b237a75684906

metadata:
  name: Stripe App Backend (Next.js)
  description: Next.js backend for a Stripe App — signed requests from the Dashboard, user login, Better Auth sessions, Supabase Postgres and Stripe webhooks
  owner: bensontrent
  tags:
    - Stripe Apps
    - Next.js
    - Supabase
    - Better Auth
    - Vercel
    - Backend

services:
  - vercel/project

next_steps:
  - label: Connect your Supabase project, generate secrets and create the database tables
    command: npm run setup
  - label: Run locally
    command: npm run dev
  - label: Get the Stripe App UI extension that talks to this backend
    command: git clone https://github.com/bensontrent/stripe-app-community-example.git stripe-app
  - label: Deploy to Vercel
    command: npm run deploy

tier_plans:
  vercel/project:
    free_lowest_cost: Vercel/hobby
    starter_paid: Vercel/pro
    higher_scale: Vercel/pro
